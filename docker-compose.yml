services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-rag-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGIN: http://localhost:5173

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: mini-rag-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
